<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Geocoding Modern</title>
    <!-- Hubungkan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

    <div class="card">
        <!-- Identitas -->
        <div class="identity-section">
            <h3>Nama : <span>Reyhan arya yudha</span></h3>
            <h3>Nim : <span>20240140025</span></h3>
        </div>

        <!-- Input Lokasi -->
        <div class="search-box">
            <label for="inputKota">Cari Lokasi / Kota</label>
            <div class="input-group">
                <input type="text" id="inputKota" value="jakarta" placeholder="Masukkan nama kota...">
                <button id="btnCari">Cari</button>
            </div>
        </div>

        <!-- Hasil Informasi -->
        <div class="results-grid">
            <div class="info-group full-width" id="box-lokasiutama">
                <div class="info-label">Lokasi Utama</div>
                <div id="Lokasi" class="info-value">Memuat...</div>
            </div>

            <div class="info-group" id="box-negara">
                <div class="info-label">Negara</div>
                <div id="Negara" class="info-value">-</div>
            </div>

            <div class="info-group" id="box-provinsi">
                <div class="info-label">Provinsi / Region</div>
                <div id="Provinsi" class="info-value">-</div>
            </div>

            <div class="info-group" id="box-kecamatan">
                <div class="info-label">Kecamatan / Sub-lokasi</div>
                <div id="Kecamatan" class="info-value">-</div>
            </div>

            <div class="info-group" id="box-lon">
                <div class="info-label">Longitude</div>
                <div id="Longitude" class="info-value">-</div>
            </div>

            <div class="info-group" id="box-lat">
                <div class="info-label">Latitude</div>
                <div id="Latitude" class="info-value">-</div>
            </div>
        </div>
    </div>

    <script>
        function cariLokasi(namaKota) {
            const urlapi = "https://api.maptiler.com/geocoding/" + encodeURIComponent(namaKota) + ".json?key=g4CpHNFxUmKT8iFUOOpb";

            // Set loading state
            $("#Lokasi").text("Mencari...");
            $("#Negara, #Provinsi, #Kecamatan, #Longitude, #Latitude").text("-");

            $.ajax({
                url: urlapi,
                method: "GET",
                success: function(data) {
                    console.log(data);
                    
                    if (!data.features || data.features.length === 0) {
                        $("#Lokasi").text("Lokasi tidak ditemukan");
                        return;
                    }

                    const feature = data.features[0];
                    
                    // 1. Lokasi Utama (Text tempat)
                    let lokasiText = feature.place_name || feature.text;
                    $("#Lokasi").text(lokasiText);

                    // 2. Koordinat [Longitude, Latitude]
                    if (feature.geometry && feature.geometry.coordinates) {
                        $("#Longitude").text(feature.geometry.coordinates[0]);
                        $("#Latitude").text(feature.geometry.coordinates[1]);
                    }

                    // 3. Parsing data dari array context (Negara, Provinsi, Kecamatan)
                    let context = feature.context;
                    let negara = "-";
                    let provinsi = "-";
                    let kecamatan = "-";

                    if (context) {
                        let countryObj = context.find(item => item.id.startsWith('country'));
                        let regionObj = context.find(item => item.id.startsWith('region'));
                        let districtObj = context.find(item => item.id.startsWith('district') || item.id.startsWith('neighborhood') || item.id.startsWith('locality'));

                        if (countryObj) negara = countryObj.text;
                        if (regionObj) provinsi = regionObj.text;
                        if (districtObj) kecamatan = districtObj.text;
                    }

                    if (feature.place_type && feature.place_type.includes('municipality')) {
                        provinsi = feature.text;
                    }

                    $("#Negara").text(negara);
                    $("#Provinsi").text(provinsi);
                    $("#Kecamatan").text(kecamatan !== '-' ? kecamatan : (feature.text || '-'));
                },
                error: function(error) {
                    console.log(error);
                    $("#Lokasi").text("Terjadi kesalahan koneksi API.");
                }
            });
        }

        // Jalankan saat pertama kali load
        $(document).ready(function() {
            cariLokasi($("#inputKota").val());

            $("#btnCari").click(function() {
                let keyword = $("#inputKota").val();
                if(keyword.trim() !== "") {
                    cariLokasi(keyword);
                }
            });

            $("#inputKota").keypress(function(e) {
                if(e.which === 13) {
                    let keyword = $(this).val();
                    if(keyword.trim() !== "") {
                        cariLokasi(keyword);
                    }
                }
            });
        });
    </script>
</body>
</html>
